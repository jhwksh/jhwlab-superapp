<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JHW LAB - 3D K-Lifestyle AI Super App</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d1117;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    #info-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(22, 27, 34, 0.85);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      max-width: 320px;
    }
    h1 {
      font-size: 1.2rem;
      margin-top: 0;
      color: #58a6ff;
    }
    p {
      font-size: 0.9rem;
      color: #8b949e;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      background: #238636;
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 8px;
    }
  </style>
  <!-- 3D 그래픽을 구현하는 Three.js 라이브러리 불러오기 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="info-overlay">
    <h1>✨ JHW LAB 3D AI Gate</h1>
    <p>마우스로 화면을 드래그해서 3D 공간을 회전시켜 보세요!</p>
    <p>📍 <strong>성수동 시그니처 3D 오브젝트</strong></p>
    <div class="badge">AI 한국어 & K-커머스 3D 체험 공간</div>
  </div>

  <script>
    // 3D 장면, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1117, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 조명 추가
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x58a6ff, 2, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    const purpleLight = new THREE.PointLight(0xbc8cff, 2, 50);
    purpleLight.position.set(-5, -5, 2);
    scene.add(purpleLight);

    // 메인 3D 입체 큐브 (성수동 에코백 / 아이템 상징)
    const geometry = new THREE.BoxGeometry(2.5, 2.5, 2.5);
    const material = new THREE.MeshStandardMaterial({
      color: 0x1f6beb,
      roughness: 0.3,
      metalness: 0.8,
      wireframe: false
    });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    // 주변을 떠도는 입자(Stars/Particles) 효과
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 700;
    const posArray = new Float32Array(particlesCount * 3);

    for(let i=0; i<particlesCount*3; i++) {
      posArray[i] = (Math.random() - 0.5) * 20;
    }

    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({
      size: 0.03,
      color: 0x58a6ff
    });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // 마우스 인터랙션 (드래그로 회전)
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    window.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const deltaMove = {
          x: e.clientX - previousMousePosition.x,
          y: e.clientY - previousMousePosition.y
        };

        cube.rotation.y += deltaMove.x * 0.008;
        cube.rotation.x += deltaMove.y * 0.008;
      }
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    // 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);

      if (!isDragging) {
        cube.rotation.x += 0.005;
        cube.rotation.y += 0.008;
      }

      particlesMesh.rotation.y -= 0.001;

      renderer.render(scene, camera);
    }

    animate();

    // 창 크기 변경 시 반응형 처리
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
